# Publishes the bottles tests.yml built for a pull request: uploads them to
# a release in this repository, adds their bottle block to the formula and
# pushes the result to main, which closes the pull request. Run it by hand
# once the pull request's checks pass:
#   gh workflow run publish.yml -R sanford/homebrew-tap -f pull_request=<number>
name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)
      bottles_only:
        description: Publish only the bottles, not the pull request's own commits (to bottle a formula that hasn't changed)
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          BOTTLES_ONLY: ${{ inputs.bottles_only }}
        run: |
          args=(--debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY")
          if [[ -n "$HEAD_SHA" ]]
          then
            args+=(--head-sha="$HEAD_SHA")
          fi
          if [[ "$BOTTLES_ONLY" == "true" ]]
          then
            args+=(--no-cherry-pick)
          fi
          brew pr-pull "${args[@]}" "$PULL_REQUEST"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          branch: main
